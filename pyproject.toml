[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-flight-studio"
version = "0.10.0"
description = "Cross-platform interactive fractal explorer with Numba CPU and optional CUDA rendering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Fractal Flight Studio contributors"}]
dependencies = [
  "numpy>=1.26",
  "numba>=0.61",
  "Pillow>=10.0",
  "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]
cuda = ["numba-cuda[cu12]"]
cuda12 = ["numba-cuda[cu12]"]
cuda13 = ["numba-cuda[cu13]"]

[project.scripts]
fractal-studio = "fractal_flight_studio.flight_app:main"
fractal-render = "fractal_flight_studio.cli:main"
fractal-doctor = "fractal_flight_studio.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
fractal_flight_studio = ["data/*.json"]
