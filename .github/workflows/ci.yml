name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m pytest -q

  validation:
    name: GUI, stability, and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb python3-tk

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build

      - name: Check pan stability
        run: python scripts/check_pan_stability.py --backend cpu

      - name: Run GUI smoke test
        run: xvfb-run -a env PYTHONPATH=src python scripts/gui_smoke.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: fractal-flight-studio-wheel
          path: dist/*.whl
          if-no-files-found: error
